<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Collaborative Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        
        .toolbar {
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .toolbar button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .toolbar button:hover {
            background: #f0f0f0;
        }
        
        .toolbar button.active {
            background: #e3f2fd;
            border-color: #2196F3;
        }
        
        .toolbar select, .toolbar input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .toolbar input[type="color"] {
            width: 50px;
            height: 35px;
            cursor: pointer;
        }
        
        .separator {
            width: 1px;
            height: 30px;
            background: #ddd;
            margin: 0 5px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        
        .editor-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .editor-wrapper {
            position: relative;
            padding: 40px;
            min-height: 600px;
        }
        
        #editor {
            width: 100%;
            min-height: 500px;
            font-size: 16px;
            line-height: 1.6;
            font-family: 'Georgia', serif;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .cursor-layer {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
            font-size: 16px;
            line-height: 1.6;
            font-family: 'Georgia', serif;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .remote-cursor {
            position: absolute;
            width: 2px;
            height: 24px;
            animation: blink 1s infinite;
        }
        
        .cursor-label {
            position: absolute;
            top: -22px;
            left: 0;
            padding: 2px 6px;
            border-radius: 3px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            font-family: Arial, sans-serif;
        }
        
        .remote-selection {
            position: absolute;
            opacity: 0.3;
            pointer-events: none;
        }
        
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        
        .sidebar {
            width: 250px;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .sidebar h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }
        
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #f8f9fa;
        }
        
        .user-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .user-name {
            font-size: 14px;
            color: #333;
        }
        
        .me-badge {
            margin-left: auto;
            padding: 2px 6px;
            background: #2196F3;
            color: white;
            border-radius: 10px;
            font-size: 11px;
        }
        
        .chat-panel {
            width: 300px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 680px;
        }
        
        .chat-header {
            padding: 15px;
            background: #2196F3;
            color: white;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-toggle {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 24px;
            height: 24px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            min-height: 400px;
            max-height: 540px;
        }
        
        .chat-message {
            margin-bottom: 12px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chat-message-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        
        .chat-user-color {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .chat-user-name {
            font-weight: 600;
            color: #333;
        }
        
        .chat-timestamp {
            color: #999;
            font-size: 11px;
            margin-left: auto;
        }
        
        .chat-message-content {
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 8px;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        
        .chat-input:focus {
            border-color: #2196F3;
        }
        
        .chat-send-btn {
            padding: 10px 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        
        .chat-send-btn:hover {
            background: #1976D2;
        }
        
        .chat-send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .chat-collapsed .chat-messages,
        .chat-collapsed .chat-input-area {
            display: none;
        }
        
        .chat-collapsed {
            max-height: 50px;
        }
        
        /* Login overlay styles */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .login-overlay.hidden {
            display: none;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-box h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 24px;
        }
        
        .login-box p {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .login-form input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        
        .login-form input:focus {
            border-color: #2196F3;
        }
        
        .login-form button {
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .login-form button:hover {
            background: #1976D2;
        }
        
        .login-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .login-error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: -5px;
            display: none;
        }
        
        .login-error.show {
            display: block;
        }
        
        .login-info {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
        }
        
        .login-info strong {
            display: block;
            margin-bottom: 8px;
            color: #1976D2;
        }
        
        .login-info code {
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- Login overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>Welcome to Collaborative Editor</h2>
            <p>Please sign in to continue</p>
            
            <form class="login-form" onsubmit="handleLogin(event)">
                <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
                <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                <div class="login-error" id="loginError">Invalid username or password</div>
                <button type="submit" id="loginButton">Sign In</button>
            </form>
            
            <div class="login-info">
                <strong>Test Accounts:</strong>
                <div>Username: <code>alice</code> / Password: <code>alice123</code></div>
                <div>Username: <code>bob</code> / Password: <code>bob123</code></div>
                <div>Username: <code>charlie</code> / Password: <code>charlie123</code></div>
            </div>
        </div>
    </div>
    
    <div class="toolbar">
        <button onclick="format('bold')" id="btn-bold" title="Bold"><b>B</b></button>
        <button onclick="format('italic')" id="btn-italic" title="Italic"><i>I</i></button>
        <button onclick="format('underline')" id="btn-underline" title="Underline"><u>U</u></button>
        
        <div class="separator"></div>
        
        <select id="fontFamily" onchange="format('fontName', this.value)">
            <option value="Georgia">Georgia</option>
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Verdana">Verdana</option>
        </select>
        
        <select id="fontSize" onchange="format('fontSize', this.value)">
            <option value="1">Small</option>
            <option value="3" selected>Normal</option>
            <option value="5">Large</option>
            <option value="7">Huge</option>
        </select>
        
        <input type="color" id="textColor" value="#000000" onchange="format('foreColor', this.value)" title="Text Color">
        
        <div class="separator"></div>
        
        <button onclick="format('insertUnorderedList')" title="Bullet List">• List</button>
        <button onclick="format('insertOrderedList')" title="Numbered List">1. List</button>
        
        <div style="margin-left: auto;"></div>
        <span id="currentUser" style="color: #666; font-size: 14px; margin-right: 10px;"></span>
        <button onclick="handleLogout()" id="logoutButton" style="background: #f44336; color: white; border-color: #f44336;">Logout</button>
    </div>
    
    <div class="container">
        <div class="editor-panel">
            <div class="editor-wrapper">
                <div id="editor" contenteditable="true"></div>
                <div class="cursor-layer" id="cursorLayer"></div>
            </div>
        </div>
        
        <div class="sidebar">
            <div id="status" class="status disconnected">Connecting...</div>
            
            <h3>Active Users (<span id="userCount">0</span>)</h3>
            <div id="userList"></div>
        </div>
        
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <span>Chat</span>
                <button class="chat-toggle" onclick="toggleChat()" title="Toggle chat">−</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." maxlength="2000" onkeypress="handleChatKeypress(event)">
                    <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const cursorLayer = document.getElementById('cursorLayer');
        const status = document.getElementById('status');
        const userCount = document.getElementById('userCount');
        const userList = document.getElementById('userList');
        const loginOverlay = document.getElementById('loginOverlay');
        const loginError = document.getElementById('loginError');
        const currentUserSpan = document.getElementById('currentUser');
        
        let myId = null;
        let myColor = null;
        let users = {};
        let isUpdating = false;
        let ws = null;
        let sessionId = null;
        let username = null;
        
        // Check for existing session on load
        window.addEventListener('DOMContentLoaded', async () => {
            const storedSessionId = localStorage.getItem('session_id');
            const storedUsername = localStorage.getItem('username');
            
            if (storedSessionId && storedUsername) {
                // Verify the stored session
                const isValid = await verifySession(storedSessionId);
                if (isValid) {
                    sessionId = storedSessionId;
                    username = storedUsername;
                    hideLoginOverlay();
                    initWebSocket();
                } else {
                    // Invalid/expired session
                    localStorage.removeItem('session_id');
                    localStorage.removeItem('username');
                    showLoginOverlay();
                }
            } else {
                showLoginOverlay();
            }
        });
        
        function showLoginOverlay() {
            loginOverlay.classList.remove('hidden');
        }
        
        function hideLoginOverlay() {
            loginOverlay.classList.add('hidden');
            currentUserSpan.textContent = 'Logged in as ' + username;
        }
        
        async function verifySession(sid) {
            try {
                const response = await fetch('/api/verify?session_id=' + encodeURIComponent(sid));
                const data = await response.json();
                return data.valid === true;
            } catch (err) {
                console.error('Session verification failed:', err);
                return false;
            }
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const loginButton = document.getElementById('loginButton');
            
            loginError.classList.remove('show');
            loginButton.disabled = true;
            loginButton.textContent = 'Signing in...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'username=' + encodeURIComponent(usernameInput.value) + 
                          '&password=' + encodeURIComponent(passwordInput.value)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    sessionId = data.session_id;
                    username = data.username;
                    
                    // Store in localStorage
                    localStorage.setItem('session_id', sessionId);
                    localStorage.setItem('username', username);
                    
                    // Hide login overlay
                    hideLoginOverlay();
                    
                    // Initialize WebSocket connection
                    initWebSocket();
                } else {
                    loginError.classList.add('show');
                }
            } catch (err) {
                console.error('Login failed:', err);
                loginError.textContent = 'Connection error. Please try again.';
                loginError.classList.add('show');
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Sign In';
            }
        }
        
        async function handleLogout() {
            if (!sessionId) return;
            
            try {
                await fetch('/api/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'session_id=' + encodeURIComponent(sessionId)
                });
            } catch (err) {
                console.error('Logout request failed:', err);
            }
            
            // Clear local storage
            localStorage.removeItem('session_id');
            localStorage.removeItem('username');
            
            // Close WebSocket
            if (ws) {
                ws.close();
                ws = null;
            }
            
            // Reset state
            sessionId = null;
            username = null;
            myId = null;
            myColor = null;
            users = {};
            
            // Show login overlay
            showLoginOverlay();
            
            // Update UI
            status.textContent = 'Disconnected';
            status.className = 'status disconnected';
            userCount.textContent = '0';
            userList.innerHTML = '';
            editor.innerHTML = '';
            document.getElementById('chatMessages').innerHTML = '';
        }
        
        function initWebSocket() {
            ws = new WebSocket('ws://' + window.location.hostname + ':8080?session_id=' + encodeURIComponent(sessionId));
            
            ws.onopen = () => {
                status.textContent = '✓ Connected';
                status.className = 'status connected';
            };
            
            ws.onmessage = (event) => {
                const data = event.data;
                const parts = data.split('|');
                const type = parts[0];
                
                if(type === 'INIT'){
                    myId = parseInt(parts[1]);
                    myColor = parts[2];
                    const doc = parts.slice(3).join('|');
                    
                    isUpdating = true;
                    editor.innerHTML = doc;
                    isUpdating = false;
                    
                    document.title = 'User #' + myId + ' - Collaborative Editor';
                }
                else if(type === 'UPDATE'){
                    const userId = parseInt(parts[1]);
                    const doc = parts.slice(2).join('|');
                    
                    if(userId !== myId){
                        isUpdating = true;
                        const selection = saveSelection();
                        editor.innerHTML = doc;
                        restoreSelection(selection);
                        isUpdating = false;
                    }
                }
                else if(type === 'USERS'){
                    users = {};
                    const userStr = parts[1];
                    if(userStr){
                        const userParts = userStr.split(',');
                        userParts.forEach(u => {
                            const [id, color, cursor, selStart, selEnd] = u.split(':');
                            users[id] = {
                                id: parseInt(id),
                                color: color,
                                cursor: parseInt(cursor),
                                selStart: parseInt(selStart),
                                selEnd: parseInt(selEnd)
                            };
                        });
                    }
                    updateUserDisplay();
                    renderCursors();
                }
                else if(type === 'CHAT'){
                    const userId = parseInt(parts[1]);
                    const userColor = parts[2];
                    const timestamp = parseInt(parts[3]);
                    const message = parts.slice(4).join('|');
                    
                    displayChatMessage(userId, userColor, timestamp, message);
                }
            };
            
            ws.onerror = () => {
                status.textContent = '✗ Connection Error';
                status.className = 'status disconnected';
            };
            
            ws.onclose = () => {
                status.textContent = '✗ Disconnected';
                status.className = 'status disconnected';
            };
        }
        
        function format(command, value = null) {
            document.execCommand(command, false, value);
            editor.focus();
            sendUpdate();
        }
        
        function updateUserDisplay(){
            const count = Object.keys(users).length;
            userCount.textContent = count;
            
            userList.innerHTML = '';
            for(let id in users){
                const u = users[id];
                const div = document.createElement('div');
                div.className = 'user-item';
                
                const colorDiv = document.createElement('div');
                colorDiv.className = 'user-color';
                colorDiv.style.backgroundColor = u.color;
                
                const name = document.createElement('span');
                name.className = 'user-name';
                name.textContent = 'User #' + u.id;
                
                div.appendChild(colorDiv);
                div.appendChild(name);
                
                if(u.id === myId){
                    const badge = document.createElement('span');
                    badge.className = 'me-badge';
                    badge.textContent = 'You';
                    div.appendChild(badge);
                }
                
                userList.appendChild(div);
            }
        }
        
        function renderCursors(){
            cursorLayer.innerHTML = '';
            
            for(let id in users){
                const u = users[id];
                if(u.id === myId) continue;
                
                // Create cursor
                const cursor = document.createElement('div');
                cursor.className = 'remote-cursor';
                cursor.style.backgroundColor = u.color;
                cursor.style.left = (u.cursor * 8) + 'px'; // Approximate positioning
                cursor.style.top = '0px';
                
                const label = document.createElement('div');
                label.className = 'cursor-label';
                label.style.backgroundColor = u.color;
                label.textContent = 'User #' + u.id;
                
                cursor.appendChild(label);
                cursorLayer.appendChild(cursor);
                
                // Create selection highlight
                if(u.selStart !== u.selEnd){
                    const sel = document.createElement('div');
                    sel.className = 'remote-selection';
                    sel.style.backgroundColor = u.color;
                    sel.style.left = (u.selStart * 8) + 'px';
                    sel.style.width = ((u.selEnd - u.selStart) * 8) + 'px';
                    sel.style.height = '24px';
                    cursorLayer.appendChild(sel);
                }
            }
        }
        
        function saveSelection() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                return selection.getRangeAt(0);
            }
            return null;
        }
        
        function restoreSelection(range) {
            if (range) {
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
            }
        }
        
        let sendTimeout;
        function sendUpdate(){
            if(isUpdating) return;
            if(ws && ws.readyState === WebSocket.OPEN){
                clearTimeout(sendTimeout);
                sendTimeout = setTimeout(() => {
                    ws.send('DOC|' + editor.innerHTML);
                    sendCursor();
                }, 200);
            }
        }
        
        function sendCursor(){
            if(ws && ws.readyState === WebSocket.OPEN){
                const selection = window.getSelection();
                let start = 0, end = 0;
                
                if(selection.rangeCount > 0){
                    const range = selection.getRangeAt(0);
                    start = range.startOffset;
                    end = range.endOffset;
                }
                
                ws.send('CURSOR|' + start + '|' + start + '|' + end);
            }
        }
        
        editor.addEventListener('input', sendUpdate);
        editor.addEventListener('keyup', sendCursor);
        editor.addEventListener('mouseup', sendCursor);
        editor.addEventListener('click', sendCursor);
        
        // Update button states
        document.addEventListener('selectionchange', () => {
            document.getElementById('btn-bold').classList.toggle('active', 
                document.queryCommandState('bold'));
            document.getElementById('btn-italic').classList.toggle('active', 
                document.queryCommandState('italic'));
            document.getElementById('btn-underline').classList.toggle('active', 
                document.queryCommandState('underline'));
        });
        
        // Chat functions
        function toggleChat() {
            const chatPanel = document.getElementById('chatPanel');
            const toggleBtn = chatPanel.querySelector('.chat-toggle');
            
            chatPanel.classList.toggle('chat-collapsed');
            toggleBtn.textContent = chatPanel.classList.contains('chat-collapsed') ? '+' : '−';
        }
        
        function sendChatMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            
            // Maximum message length (should match server MAX_CHAT_MSG_SIZE)
            const MAX_LENGTH = 2000;
            
            if(message && ws && ws.readyState === WebSocket.OPEN){
                if(message.length > MAX_LENGTH){
                    alert('Message is too long. Maximum ' + MAX_LENGTH + ' characters allowed.');
                    return;
                }
                ws.send('CHAT|' + message);
                chatInput.value = '';
            }
        }
        
        function handleChatKeypress(event) {
            if(event.key === 'Enter'){
                sendChatMessage();
            }
        }
        
        function displayChatMessage(userId, userColor, timestamp, message) {
            const chatMessages = document.getElementById('chatMessages');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'chat-message-header';
            
            const colorDot = document.createElement('div');
            colorDot.className = 'chat-user-color';
            colorDot.style.backgroundColor = userColor;
            
            const userName = document.createElement('span');
            userName.className = 'chat-user-name';
            userName.textContent = 'User #' + userId;
            if(userId === myId) {
                userName.textContent += ' (You)';
            }
            
            const time = document.createElement('span');
            time.className = 'chat-timestamp';
            const date = new Date(timestamp * 1000);
            time.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            headerDiv.appendChild(colorDot);
            headerDiv.appendChild(userName);
            headerDiv.appendChild(time);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'chat-message-content';
            contentDiv.textContent = message;
            
            messageDiv.appendChild(headerDiv);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            // Auto-scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
