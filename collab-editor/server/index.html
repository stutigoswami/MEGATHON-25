<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collaborative Editor</title>
<style>
    body, html { margin:0; padding:0; height:100%; font-family: 'Segoe UI', sans-serif; background:#f5f5f5; }
    #loginScreen, #editorScreen { width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
    #loginScreen { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-card { background:white; padding:40px; border-radius:12px; width:350px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .login-card h1 { text-align:center; margin-bottom:20px; color:#333; }
    .form-group { margin-bottom:15px; }
    .form-group input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; }
    .btn-login { width:100%; padding:12px; background:#667eea; color:white; border:none; border-radius:6px; cursor:pointer; }
    .btn-login:hover { background:#5568d3; }
    .error { color:#e74c3c; margin-top:10px; text-align:center; }

    #editorScreen { display:none; flex-direction:column; }
    .header { display:flex; justify-content:space-between; align-items:center; background:white; padding:12px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .header h1 { font-size:20px; color:#333; }
    .btn-logout { padding:6px 12px; background:#e74c3c; color:white; border:none; border-radius:6px; cursor:pointer; }
    .btn-logout:hover { background:#c0392b; }

    .main-container { flex:1; display:flex; overflow:hidden; }
    .sidebar { width:220px; background:white; padding:15px; border-right:1px solid #ddd; overflow-y:auto; }
    .user-list, .chat-messages { list-style:none; padding:0; margin:0; }
    .user-item { padding:6px 10px; margin-bottom:5px; background:#f8f8f8; border-radius:6px; display:flex; align-items:center; gap:8px; }
    .user-color { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

    .editor-wrapper { flex:1; position:relative; display:flex; flex-direction:column; }
    .toolbar { padding:10px; background:#f8f8f8; display:flex; gap:5px; flex-wrap:wrap; border-bottom:1px solid #ddd; }
    .toolbar button, .toolbar select, .toolbar input[type=color] { padding:6px 10px; border-radius:4px; border:1px solid #ccc; cursor:pointer; }
    #editor { flex:1; padding:20px; overflow:auto; outline:none; font-size:16px; line-height:1.6; background:white; white-space:pre-wrap; word-wrap:break-word; position:relative; }
    .remote-cursor { position:absolute; width:2px; height:24px; pointer-events:none; z-index:100; }
    .cursor-label { position:absolute; top:-20px; left:2px; background: #333; color:white; font-size:10px; padding:1px 4px; border-radius:3px; white-space:nowrap; }
    .remote-selection { position:absolute; opacity:0.25; pointer-events:none; z-index:50; background:yellow; }

    .chat-panel { width:220px; background:white; border-left:1px solid #ddd; display:flex; flex-direction:column; }
    .chat-messages { flex:1; overflow-y:auto; padding:10px; }
    .chat-input { display:flex; padding:5px; border-top:1px solid #ddd; }
    .chat-input input { flex:1; padding:6px; border-radius:4px; border:1px solid #ccc; }
    .chat-input button { padding:6px 10px; border-radius:4px; border:none; background:#667eea; color:white; cursor:pointer; margin-left:4px; }
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <h1>Collaborative Editor</h1>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        <button class="btn-login" id="loginBtn">Login</button>
        <div class="error" id="loginError"></div>
    </div>
</div>

<div id="editorScreen">
    <div class="header">
        <h1>Collaborative Editor</h1>
        <div>
            <span id="currentUsername"></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>
    <div class="main-container">
        <div class="sidebar">
            <h3>Active Users</h3>
            <ul class="user-list" id="userList"></ul>
        </div>

        <div class="editor-wrapper">
            <div class="toolbar">
                <button onclick="formatDoc('bold')"><b>B</b></button>
                <button onclick="formatDoc('italic')"><i>I</i></button>
                <button onclick="formatDoc('underline')"><u>U</u></button>
                <select onchange="formatDoc('fontName', this.value); this.selectedIndex=0;">
                    <option disabled selected>Font</option>
                    <option>Arial</option>
                    <option>Courier New</option>
                    <option>Georgia</option>
                    <option>Times New Roman</option>
                    <option>Verdana</option>
                </select>
                <select onchange="formatDoc('fontSize', this.value); this.selectedIndex=0;">
                    <option disabled selected>Size</option>
                    <option value="2">Small</option>
                    <option value="3">Normal</option>
                    <option value="5">Large</option>
                    <option value="7">Huge</option>
                </select>
                <input type="color" onchange="formatDoc('foreColor', this.value)">
            </div>
            <div id="editor" contenteditable="true"></div>
        </div>

        <div class="chat-panel">
            <h3>Chat</h3>
            <ul class="chat-messages" id="chatMessages"></ul>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
let ws=null;
let sessionId=null;
let currentUsername=null;
let myColor=null;
let users=[];
let remoteCursors={};
let remoteSelections={};

document.getElementById('loginBtn').addEventListener('click',async()=>{
    const username=document.getElementById('username').value;
    const password=document.getElementById('password').value;
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(data.success){ sessionId=data.session_id; currentUsername=data.username;
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('editorScreen').style.display='flex';
        document.getElementById('currentUsername').textContent=currentUsername;
        connectWS();
    } else document.getElementById('loginError').textContent=data.error;
});

function logout(){
    if(ws) ws.close();
    fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});
    location.reload();
}

function connectWS(){
    const proto=location.protocol==='https:'?'wss:':'ws:';
    ws=new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen=()=>{ ws.send(JSON.stringify({type:'auth',session_id:sessionId})); }
    ws.onmessage=(evt)=>{ const msg=JSON.parse(evt.data);
        if(msg.type==='init'){ document.getElementById('editor').innerHTML=msg.content; myColor=msg.color; }
        else if(msg.type==='update'){ document.getElementById('editor').innerHTML=msg.content; }
        else if(msg.type==='users'){ updateUserList(msg.users); }
        else if(msg.type==='cursor'){ updateRemoteCursor(msg); }
        else if(msg.type==='selection'){ updateRemoteSelection(msg); }
        else if(msg.type==='chat'){ addChat(msg.username,msg.message); }
    }
}

const editor=document.getElementById('editor');
editor.addEventListener('input',()=>{ if(ws && ws.readyState===1){ ws.send(JSON.stringify({type:'update',content:editor.innerHTML})); } });
editor.addEventListener('keyup',sendCursor);
editor.addEventListener('mouseup',sendCursor);

function sendCursor(){ if(!ws||ws.readyState!==1) return;
    const sel=window.getSelection(); if(sel.rangeCount>0){ const r=sel.getRangeAt(0);
        if(r.collapsed){ const offset=getOffset(editor,r.startContainer,r.startOffset);
            ws.send(JSON.stringify({type:'cursor',offset:offset}));
        } else { const start=getOffset(editor,r.startContainer,r.startOffset); const end=getOffset(editor,r.endContainer,r.endOffset);
            ws.send(JSON.stringify({type:'selection',start:start,end:end}));
        }
    }
}

function getOffset(root,node,off){ let t=0; const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false); let n; while(n=walker.nextNode()){ if(n===node) return t+off; t+=n.textContent.length; } return 0; }
function getNodeFromOffset(root,offset){ let t=0; const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false); let n; while(n=walker.nextNode()){ if(t+n.textContent.length>=offset) return {node:n,off:offset-t}; t+=n.textContent.length; } return {node:root,off:0}; }

function updateUserList(list){ users=list; const ul=document.getElementById('userList'); ul.innerHTML=''; list.forEach(u=>{ const li=document.createElement('li'); li.className='user-item'; li.innerHTML=`<div class="user-color" style="background:${u.color}"></div><span>${u.username}${u.username===currentUsername?' (you)':''}</span>`; ul.appendChild(li); }); }

function updateRemoteCursor(msg){ if(msg.username===currentUsername) return;
    let c=document.getElementById('cursor-'+msg.username); if(!c){ c=document.createElement('div'); c.className='remote-cursor'; c.id='cursor-'+msg.username; const l=document.createElement('div'); l.className='cursor-label'; l.style.background=msg.color; l.textContent=msg.username; c.appendChild(l); editor.appendChild(c); } 
    const pos=getNodeFromOffset(editor,msg.offset); const r=document.createRange(); r.setStart(pos.node,pos.off); r.setEnd(pos.node,pos.off);
    const rect=r.getBoundingClientRect(); const eRect=editor.getBoundingClientRect();
    c.style.left=(rect.left-eRect.left+editor.scrollLeft)+'px'; c.style.top=(rect.top-eRect.top+editor.scrollTop)+'px';
}

function updateRemoteSelection(msg){ if(msg.username===currentUsername) return;
    let s=document.getElementById('selection-'+msg.username); if(!s){ s=document.createElement('div'); s.className='remote-selection'; s.id='selection-'+msg.username; editor.appendChild(s); }
    const start=getNodeFromOffset(editor,msg.start); const end=getNodeFromOffset(editor,msg.end);
    const r=document.createRange(); r.setStart(start.node,start.off); r.setEnd(end.node,end.off);
    const rect=r.getBoundingClientRect(); const eRect=editor.getBoundingClientRect();
    s.style.left=(rect.left-eRect.left+editor.scrollLeft)+'px'; s.style.top=(rect.top-eRect.top+editor.scrollTop)+'px';
    s.style.width=rect.width+'px'; s.style.height=rect.height+'px';
}

function formatDoc(cmd,val=null){ document.execCommand(cmd,false,val); editor.focus(); if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'update',content:editor.innerHTML})); }

function sendChat(){ const input=document.getElementById('chatInput'); if(input.value.trim()==='') return; ws.send(JSON.stringify({type:'chat',message:input.value})); input.value=''; }

function addChat(user,msg){ const ul=document.getElementById('chatMessages'); const li=document.createElement('li'); li.textContent=`${user}: ${msg}`; ul.appendChild(li); ul.scrollTop=ul.scrollHeight; }
</script>

</body>
</html>
